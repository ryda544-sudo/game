<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alpha Beta Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #17212b);
            --text: var(--tg-theme-text-color, #ffffff);
            --hint: var(--tg-theme-hint-color, #7f91a4);
            --btn: var(--tg-theme-button-color, #5288c1);
            --btn-text: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #232e3c);
        }

        * { box-sizing: border-box; user-select: none; }
        
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .screen { display: none; width: 100%; max-width: 400px; flex-direction: column; align-items: center; animation: fadeIn 0.3s ease; }
        .screen.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- ГЛАВНОЕ МЕНЮ --- */
        .greeting { font-size: 24px; font-weight: bold; margin-bottom: 40px; margin-top: 20px; text-align: center; }
        
        .main-buttons { display: flex; flex-direction: column; gap: 15px; width: 100%; }
        .btn {
            background: var(--btn); color: var(--btn-text); border: none; padding: 15px; 
            border-radius: 12px; font-size: 18px; font-weight: 600; cursor: pointer;
            transition: transform 0.1s; text-align: center;
        }
        .btn:active { transform: scale(0.96); }
        .btn-secondary { background: var(--secondary-bg); color: var(--text); }
        
        .play-btn-container { margin-top: auto; padding-bottom: 20px; width: 100%; display: flex; justify-content: center; }
        .play-btn { 
            background: #28a745; font-size: 22px; padding: 18px 50px; border-radius: 30px; 
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4); color: white;
        }

        /* --- ИГРОВОЙ ЭКРАН --- */
        .game-header { width: 100%; display: flex; justify-content: space-between; font-size: 14px; color: var(--hint); margin-bottom: 30px; }
        .score-board { display: flex; justify-content: space-around; width: 100%; margin-bottom: 40px; }
        .score-box { background: var(--secondary-bg); padding: 20px; border-radius: 15px; width: 45%; text-align: center; }
        .score-box .label { font-size: 14px; color: var(--hint); margin-bottom: 5px; }
        .score-box .value { font-size: 36px; font-weight: bold; }
        .score-green { color: #28a745; }
        .score-red { color: #dc3545; }

        .choice-buttons { display: flex; gap: 15px; width: 100%; margin-top: auto; padding-bottom: 40px; }
        .choice-btn { flex: 1; padding: 30px 10px; border-radius: 20px; font-size: 20px; font-weight: bold; border: none; color: white; }
        .choice-alpha { background: #007aff; box-shadow: 0 4px 15px rgba(0, 122, 255, 0.3); }
        .choice-beta { background: #ff3b30; box-shadow: 0 4px 15px rgba(255, 59, 48, 0.3); }

        /* --- СПИСКИ И НАСТРОЙКИ --- */
        .list-item { width: 100%; background: var(--secondary-bg); padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .back-btn { position: absolute; top: 20px; left: 20px; background: none; border: none; color: var(--hint); font-size: 16px; cursor: pointer; }
        .title-screen { font-size: 22px; font-weight: bold; margin-bottom: 20px; margin-top: 40px; }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: ГЛАВНОЕ МЕНЮ -->
    <div id="main-menu" class="screen active">
        <div class="greeting" id="greeting-text">Привет, Игрок!</div>
        
        <div class="main-buttons">
            <button class="btn btn-secondary" onclick="showScreen('leaderboard')">🏆 Рейтинг</button>
            <button class="btn btn-secondary" onclick="showScreen('friends')">👥 Друзья</button>
            <button class="btn btn-secondary" onclick="showScreen('clan')">🛡️ Клан</button>
            <button class="btn btn-secondary" onclick="showScreen('settings')">⚙️ Настройки</button>
        </div>

        <div class="play-btn-container">
            <button class="btn play-btn" onclick="showScreen('mode-select')">ИГРАТЬ</button>
        </div>
    </div>

    <!-- ЭКРАН 2: ВЫБОР РЕЖИМА -->
    <div id="mode-select" class="screen">
        <button class="back-btn" onclick="showScreen('main-menu')">← Назад</button>
        <div class="title-screen">Выбор режима</div>
        
        <div class="main-buttons">
            <button class="btn" onclick="startGame('bot')">🤖 С ботом</button>
            <button class="btn" onclick="startGame('local')">📱 Локально (с другом)</button>
            <button class="btn" onclick="startOnline()">🌐 Онлайн (поиск)</button>
            <button class="btn btn-secondary" onclick="startGame('infinite')">∞ Бесконечный</button>
        </div>
    </div>

    <!-- ЭКРАН 3: ИГРА -->
    <div id="game-screen" class="screen">
        <div class="game-header">
            <span id="mode-label">Режим</span>
            <span id="target-label">Цель: +7 / -3</span>
        </div>

        <div class="score-board">
            <div class="score-box">
                <div class="label" id="p1-name">Вы</div>
                <div class="value" id="p1-score">0</div>
            </div>
            <div class="score-box">
                <div class="label" id="p2-name">Соперник</div>
                <div class="value" id="p2-score">0</div>
            </div>
        </div>

        <div style="text-align: center; margin-bottom: 20px; color: var(--hint); font-size: 14px;" id="game-status">
            Выберите свою сторону
        </div>

        <div class="choice-buttons" id="choice-buttons">
            <button class="choice-btn choice-alpha" onclick="makeChoice('alpha')">АЛЬФА</button>
            <button class="choice-btn choice-beta" onclick="makeChoice('beta')">БЕТА</button>
        </div>
    </div>

    <!-- ЭКРАН 4: РЕЙТИНГ -->
    <div id="leaderboard" class="screen">
        <button class="back-btn" onclick="showScreen('main-menu')">← Назад</button>
        <div class="title-screen">Топ игроков</div>
        <div id="leaderboard-list"></div>
    </div>

    <!-- ЭКРАН 5: ДРУЗЬЯ -->
    <div id="friends" class="screen">
        <button class="back-btn" onclick="showScreen('main-menu')">← Назад</button>
        <div class="title-screen">Друзья</div>
        <div class="list-item">
            <span>Иван Иванов</span>
            <span class="score-green">+12</span>
        </div>
        <div class="list-item">
            <span>Мария С.</span>
            <span class="score-red">-2</span>
        </div>
        <div style="color: var(--hint); text-align: center; margin-top: 20px;">Пока это демо-версия списка</div>
    </div>

    <!-- ЭКРАН 6: КЛАН -->
    <div id="clan" class="screen">
        <button class="back-btn" onclick="showScreen('main-menu')">← Назад</button>
        <div class="title-screen">Мой Клан</div>
        <div class="score-box" style="width: 100%; margin-bottom: 20px;">
            <div class="label">Название клана</div>
            <div class="value" style="font-size: 24px;">Альфа-Стая</div>
            <div class="label" style="margin-top: 10px;">Рейтинг клана: 1540</div>
        </div>
        <div class="list-item"><span>Вы</span> <span>Лидер</span></div>
        <div class="list-item"><span>Друг 1</span> <span>Участник</span></div>
    </div>

    <!-- ЭКРАН 7: НАСТРОЙКИ -->
    <div id="settings" class="screen">
        <button class="back-btn" onclick="showScreen('main-menu')">← Назад</button>
        <div class="title-screen">Настройки</div>
        <div class="list-item"><span>Звуки</span> <span>Вкл</span></div>
        <div class="list-item"><span>Вибрация</span> <span>Вкл</span></div>
        <div style="color: var(--hint); text-align: center; margin-top: 20px;">Версия 1.0.0</div>
    </div>

    <script>
        // Инициализация Telegram
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Получаем имя игрока
        const user = tg.initDataUnsafe?.user;
        const playerName = user ? user.first_name : 'Игрок';
        document.getElementById('greeting-text').innerText = `Привет, ${playerName}!`;

        // Переключение экранов
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // --- ЛОГИКА ИГРЫ ---
        let currentMode = 'bot';
        let score1 = 0, score2 = 0;
        let isGameOver = false;

        function startGame(mode) {
            currentMode = mode;
            score1 = 0; score2 = 0;
            isGameOver = false;
            
            document.getElementById('p1-name').innerText = mode === 'local' ? 'Игрок 1' : playerName;
            document.getElementById('p2-name').innerText = mode === 'local' ? 'Игрок 2' : 'Бот';
            
            let targetText = 'Цель: +7 / -3';
            if (mode === 'infinite') targetText = 'Бесконечный режим';
            
            document.getElementById('target-label').innerText = targetText;
            document.getElementById('mode-label').innerText = 
                mode === 'bot' ? 'Режим: С ботом' : 
                mode === 'local' ? 'Режим: Локально' : 
                mode === 'infinite' ? 'Режим: Бесконечный' : 'Режим: Онлайн';

            updateScoreDisplay();
            document.getElementById('game-status').innerText = 'Выберите свою сторону';
            document.getElementById('choice-buttons').style.opacity = '1';
            document.getElementById('choice-buttons').style.pointerEvents = 'auto';

            showScreen('game-screen');
        }

        function startOnline() {
            tg.showAlert("Поиск соперника...\n(Пока что мы найдем вам бота для теста)");
            setTimeout(() => {
                startGame('bot');
            }, 1500);
        }

        function updateScoreDisplay() {
            let p1El = document.getElementById('p1-score');
            let p2El = document.getElementById('p2-score');
            
            p1El.innerText = score1;
            p2El.innerText = score2;

            p1El.className = score1 >= 0 ? 'value score-green' : 'value score-red';
            p2El.className = score2 >= 0 ? 'value score-green' : 'value score-red';
        }

        function checkGameOver() {
            if (currentMode === 'infinite') return false; // В бесконечном не заканчиваем

            if (score1 >= 7 || score1 <= -3 || score2 >= 7 || score2 <= -3) {
                isGameOver = true;
                
                // Блокируем кнопки
                document.getElementById('choice-buttons').style.opacity = '0.5';
                document.getElementById('choice-buttons').style.pointerEvents = 'none';
                
                let msg = "";
                if (score1 >= 7) msg = "🏆 ВЫ ПОБЕДИЛИ! Набрано 7 очков.";
                else if (score1 <= -3) msg = "💀 ВЫ ПРОИГРАЛИ. Набрано -3 очка.";
                else if (score2 >= 7) msg = "Бот победил.";
                else if (score2 <= -3) msg = "Бот проиграл.";

                setTimeout(() => {
                    tg.showAlert(msg);
                    setTimeout(() => showScreen('main-menu'), 1000);
                }, 500);
                return true;
            }
            return false;
        }

        function makeChoice(playerChoice) {
            if (isGameOver) return;

            let choice1, choice2;
            
            if (currentMode === 'local') {
                // Локальный режим: Игрок 1 ходит, потом Игрок 2. Пока для простоты 
                // сделаем так: Игрок 1 жмет, потом он же жмет за Игрока 2.
                // Для простоты сделаем вид, что второй игрок передает телефон.
                // В реальном коде тут нужен экран "Передайте телефон Игроку 2".
                // Сделаем просто: оба выбирают случайно для демо.
                
                // Упрощение: Игрок 1 нажал. Ждем второго нажатия.
                // Чтобы не усложнять код, сделаем оба выбора случайными для второго.
                choice1 = playerChoice;
                choice2 = Math.random() > 0.5 ? 'alpha' : 'beta'; // Заглушка для Игрока 2
            } else {
                // Против бота
                choice1 = playerChoice;
                // Умный бот: 50/50
                choice2 = Math.random() > 0.5 ? 'alpha' : 'beta';
            }

            calculateResult(choice1, choice2);
        }

        function calculateResult(c1, c2) {
            let res1 = 0, res2 = 0;
            let text = "";

            if (c1 === 'alpha' && c2 === 'beta') {
                res1 = 3; res2 = -1;
                text = "Вы Альфа, соперник Бета. Вы +3, он -1.";
            } else if (c1 === 'alpha' && c2 === 'alpha') {
                res1 = 0; res2 = 0;
                text = "Оба Альфа. По 0 очков. (Можно в союзники)";
            } else if (c1 === 'beta' && c2 === 'alpha') {
                res1 = -1; res2 = 3;
                text = "Вы Бета, соперник Альфа. Вы -1, он +3.";
            } else if (c1 === 'beta' && c2 === 'beta') {
                res1 = 1; res2 = 1;
                text = "Оба Бета. По +1 очку.";
            }

            score1 += res1;
            score2 += res2;

            updateScoreDisplay();
            document.getElementById('game-status').innerText = text;

            // Проверка на конец игры
            checkGameOver();
        }
    </script>
</body>
</html>
