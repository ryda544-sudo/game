<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Дилемма Заключенного</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;900&display=swap');

        :root {
            --bg: #0a0a0a;
            --text: #ffffff;
            --accent-alpha: #00FF41; /* Сдать */
            --accent-beta: #FF003C;  /* Молчать */
            --border: #333;
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 20px;
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg); color: var(--text);
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
            background-image: linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .screen { display: none; width: 100%; max-width: 400px; flex-direction: column; animation: fadeIn 0.2s ease; }
        .screen.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .menu-grid { display: flex; flex-direction: column; gap: 10px; width: 100%; }
        
        .btn {
            background: transparent; color: var(--text); border: 2px solid var(--border);
            padding: 15px 20px; font-size: 16px; font-weight: 700; text-transform: uppercase;
            font-family: 'Space Grotesk', sans-serif; cursor: pointer;
            width: 100%; transition: all 0.1s; text-align: left; display: flex; justify-content: space-between; align-items: center;
        }
        .btn:active { background: var(--text); color: var(--bg); }

        .btn-play { border: none; background: var(--text); color: var(--bg); font-size: 24px; justify-content: center; margin-top: 15px; padding: 20px; }

        /* Профиль */
        .profile-header {
            width: 100%; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid var(--border); padding-bottom: 10px; margin-bottom: 15px;
            font-size: 12px; color: #888; text-transform: uppercase; font-weight: 700;
        }

        .inmate-box {
            width: 100%; border: 2px solid var(--accent-alpha); padding: 20px; 
            display: flex; flex-direction: column; align-items: center; margin-bottom: 20px; position: relative; overflow: hidden;
        }
        .inmate-box::after {
            content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(90deg, transparent, transparent 20px, rgba(0,255,65,0.1) 20px, rgba(0,255,65,0.1) 25px);
            pointer-events: none;
        }
        .inmate-svg { width: 80px; height: 80px; fill: var(--accent-alpha); margin-bottom: 10px; z-index: 1;}
        .inmate-name { font-size: 18px; font-weight: 900; text-transform: uppercase; z-index: 1; color: var(--accent-alpha);}
        .inmate-crime { font-size: 12px; color: #888; text-transform: uppercase; z-index: 1; margin-top: 5px;}

        .progress-container { width: 100%; margin-bottom: 20px; }
        .progress-text { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; margin-bottom: 5px; text-transform: uppercase;}
        .progress-bar { width: 100%; height: 10px; background: var(--border); border: 1px solid #555; }
        .progress-fill { height: 100%; background: var(--accent-alpha); width: 0%; transition: width 0.3s; }

        .brutal-title { font-size: 36px; font-weight: 900; line-height: 1.1; text-transform: uppercase; margin-bottom: 20px; letter-spacing: -1px; }
        .brutal-title .highlight { color: var(--accent-alpha); }

        .nav-back { background: none; border: none; color: #888; font-size: 14px; font-weight: 700; text-transform: uppercase; cursor: pointer; padding: 0; margin-bottom: 20px; text-align: left; }

        /* Игровой экран */
        .case-box {
            width: 100%; border: 2px dashed #555; padding: 20px; margin-bottom: 20px; 
            background: rgba(0,0,0,0.5); min-height: 150px; display: flex; flex-direction: column; justify-content: center;
        }
        .case-title { color: var(--accent-beta); font-weight: 900; font-size: 18px; margin-bottom: 10px; text-transform: uppercase; }
        .case-text { font-size: 14px; line-height: 1.5; color: #ddd; }

        .timer-display { font-size: 48px; font-weight: 900; text-align: center; margin-bottom: 20px; font-variant-numeric: tabular-nums; }
        .timer-display.red { color: var(--accent-beta); animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .choices { display: flex; gap: 10px; width: 100%; margin-top: auto; }
        .choice-btn {
            flex: 1; padding: 20px 10px; font-size: 16px; font-weight: 900; 
            border: none; color: var(--bg); font-family: 'Space Grotesk', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-transform: uppercase;
        }
        .choice-btn span { font-size: 10px; font-weight: 700; margin-top: 5px; }
        .c-alpha { background: var(--accent-alpha); }
        .c-beta { background: var(--accent-beta); color: white; }

        .disabled-btn { opacity: 0.3; pointer-events: none; }

        .list-item { width: 100%; border-bottom: 1px solid var(--border); padding: 15px 0; display: flex; justify-content: space-between; font-size: 16px; font-weight: 700; }
        .text-green { color: var(--accent-alpha); }
        .text-red { color: var(--accent-beta); }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: ГЛАВНОЕ МЕНЮ -->
    <div id="main-menu" class="screen active">
        <div class="profile-header">
            <div id="player-id">ЗАКЛЮЧЕННЫЙ</div>
            <div>ДЕЛА: <span id="exp-counter">0</span></div>
        </div>

        <div class="inmate-box">
            <svg class="inmate-svg" viewBox="0 0 24 24"><path d="M12 2C9.79 2 8 3.79 8 6s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm0 10c-3.31 0-10 1.67-10 5v3h20v-3c0-3.33-6.69-5-10-5z"/></svg>
            <div class="inmate-name" id="level-name">ГЕНРИ ХИЛЛ</div>
            <div class="inmate-crime" id="level-crime">ОГРАБЛЕНИЕ БАНКА</div>
        </div>

        <div class="progress-container">
            <div class="progress-text">
                <span>УРОВЕНЬ <span id="level-num">1</span></span>
                <span id="exp-text">0 / 7 ДЕЛ</span>
            </div>
            <div class="progress-bar"><div class="progress-fill" id="exp-bar"></div></div>
        </div>
        
        <div class="menu-grid">
            <button class="btn" onclick="showScreen('leaderboard')">🏆 Рейтинг <span>→</span></button>
            <button class="btn" onclick="showScreen('friends')">👥 Друзья <span>→</span></button>
            <button class="btn" onclick="showScreen('clan')">🛡️ Клан <span>→</span></button>
            <button class="btn" onclick="showScreen('settings')">⚙️ Настройки <span>→</span></button>
        </div>
        <button class="btn btn-play" onclick="showScreen('mode-select')">В СУД</button>
    </div>

    <!-- ЭКРАН 2: ВЫБОР РЕЖИМА -->
    <div id="mode-select" class="screen">
        <button class="nav-back" onclick="showScreen('main-menu')">← НАЗАД</button>
        <div class="brutal-title" style="font-size: 28px;">РЕЖИМ</div>
        <div class="menu-grid">
            <button class="btn" onclick="startGame('bot')">🤖 С БОТОМ</button>
            <button class="btn" onclick="startGame('local')">📱 ЛОКАЛЬНО (С ДРУГОМ)</button>
            <button class="btn" onclick="startOnline()">🌐 ОНЛАЙН (ПОИСК)</button>
            <button class="btn" onclick="startGame('infinite')">∞ БЕЗ ЛИМИТА</button>
        </div>
    </div>

    <!-- ЭКРАН 3: ЧТЕНИЕ ДЕЛА -->
    <div id="case-screen" class="screen">
        <div class="profile-header" style="justify-content: center; border: none; color: var(--accent-beta);">
            ОЗНАКОМЛЕНИЕ С ДЕЛОМ
        </div>
        <div class="timer-display red" id="timer-read">25</div>
        <div class="case-box">
            <div class="case-title" id="case-title-read">ДЕЛО №1</div>
            <div class="case-text" id="case-text-read">Текст дела...</div>
        </div>
    </div>

    <!-- ЭКРАН 4: ВЫБОР (СУД) -->
    <div id="game-screen" class="screen">
        <div style="width: 100%; display: flex; justify-content: space-between; font-size: 12px; color: #888; text-transform: uppercase; margin-bottom: 15px;">
            <span id="mode-label">СУД</span>
            <span id="target-label">РАУНД 1 ИЗ 2</span>
        </div>

        <div class="timer-display" id="timer-choose">90</div>
        
        <div class="case-box" style="min-height: 80px; margin-bottom: 10px;">
            <div class="case-text" style="font-size: 12px; color: #888;" id="case-brief">Краткое описание...</div>
        </div>

        <div id="game-status" style="text-align: center; font-weight: 700; text-transform: uppercase; margin-bottom: 10px; font-size: 14px;">
            ПРИМИТЕ РЕШЕНИЕ
        </div>

        <div class="choices" id="choice-buttons">
            <button class="choice-btn c-alpha" onclick="makeChoice('betray')">
                СДАТЬ НАПАРНИКА <span>(0 ЛЕТ)</span>
            </button>
            <button class="choice-btn c-beta" onclick="makeChoice('silent')">
                МОЛЧАТЬ <span>(3 ГОДА)</span>
            </button>
        </div>
    </div>

    <!-- ЭКРАН 5: РЕЗУЛЬТАТ РАУНДА -->
    <div id="result-screen" class="screen">
        <div class="brutal-title" style="font-size: 28px; margin-top: 50px;">ПРИГОВОР</div>
        <div class="case-box" style="border-color: var(--accent-alpha);">
            <div class="case-text" id="result-text" style="font-size: 16px; line-height: 1.8;">...</div>
        </div>
        <button class="btn btn-play" onclick="nextRound()">ДАЛЕЕ</button>
    </div>

    <!-- ОСТАЛЬНЫЕ ЭКРАНЫ (Заглушки) -->
    <div id="leaderboard" class="screen"><button class="nav-back" onclick="showScreen('main-menu')">← НАЗАД</button><div class="brutal-title" style="font-size: 28px;">ТОП</div></div>
    <div id="friends" class="screen"><button class="nav-back" onclick="showScreen('main-menu')">← НАЗАД</button><div class="brutal-title" style="font-size: 28px;">ДРУЗЬЯ</div></div>
    <div id="clan" class="screen"><button class="nav-back" onclick="showScreen('main-menu')">← НАЗАД</button><div class="brutal-title" style="font-size: 28px;">КЛАН</div></div>
    <div id="settings" class="screen"><button class="nav-back" onclick="showScreen('main-menu')">← НАЗАД</button><div class="brutal-title" style="font-size: 28px;">НАСТРОЙКИ</div></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        const user = tg.initDataUnsafe?.user;
        document.getElementById('player-id').innerText = user ? `ИГРОК: ${user.first_name}` : 'ЗАКЛЮЧЕННЫЙ';

        // --- БАЗА ДЕЛ (СЮЖЕТЫ) ---
        const cases = [
            { title: "ДЕЛО О КРАЖЕ БЮДЖЕТА", text: "Ты и твой напарник — бухгалтеры в мэрии. Вы украли 50 миллионов рублей, выделенных на ремонт детских садов. Следователь нашел неопровержимые улики. У тебя есть жена и двое детей, у напарника — больная мать. Если ты сдашь его, тебе дадут иммунитет. Если промолчишь — посадят обоих." },
            { title: "ДЕЛО О ГОНКЕ", text: "Ночная гонка закончилась тем, что ваш автомобиль сбил пешехода. За рулем был твой лучший друг, но вы оба были пьяны. Камеры зафиксировали машину, но лица не видно. Если ты сдашь друга, ты выйдешь сухим из воды. Если промолчите — вину поделят на двоих (по 7 лет каждому)." },
            { title: "ДЕЛО О МАХИНАЦИЯХ С КРИПТОВАЛЮТОЙ", text: "Вы с напарником запустили финансовую пирамиду. Люди потеряли квартиры. Прокуратура вышла на ваш след. Сдать напарника — шанс выйти под залог и сохранить часть активов. Молчать — значит сесть на долгие годы за мошенничество в особо крупном размере." },
            { title: "ДЕЛО О НАПАДЕНИИ", text: "Вы с напарником ограбили ювелирный магазин. Охранник получил тяжелые травмы. Следователь предлагает сделку: если ты сдашь напарника и покажешь, где спрятаны камни, тебя отпустят прямо в зале суда. Напарник уверен, что ты его не сдашь." },
            { title: "ДЕЛО ОБ ОРГАНИЗОВАННОЙ ГРУППЕ", text: "Ты и напарник перевозили запрещенные вещества через границу. Вас взяли на таможне. Если ты сдашь всю цепочку поставок и напарника — тебя переведут в свидетели. Если будешь молчать, получишь максимальный срок как член ОПГ." },
            { title: "ДЕЛО О ПОДЖОГЕ", text: "Вы с напарником сожгли конкурентный бизнес. Погиб сторож. Следователь говорит, что на записях видно двоих. Если ты сдашь напарника первым, тебе скостят срок до условного. Если оба будете молчать — обоим дадут по 7 лет строгого режима." }
        ];

        // --- СИСТЕМА УРОВНЕЙ (МАКСИМУМ ДЕЛ) ---
        const levels = [
            { level: 1, maxExp: 7,  name: "ГЕНРИ ХИЛЛ",     crime: "ОГРАБЛЕНИЕ БАНКА" },
            { level: 2, maxExp: 12, name: "ДЖО ПЕШИ",       crime: "ВЫМОГАТЕЛЬСТВО" },
            { level: 3, maxExp: 17, name: "АЛЬ КАПОНЕ",     crime: "КОНТРАБАНДА" },
            { level: 4, maxExp: 22, name: "ФРЭНК ЛУКАС",    crime: "НАРКОТИКИ" },
            { level: 5, maxExp: 25, name: "ПАБЛО ЭСКОБАР",  crime: "ВСЕ СТАТЬИ" }
        ];

        let totalExp = parseInt(localStorage.getItem('prisonExp')) || 0;
        
        function updateLevelUI() {
            let currentLvlData = levels[0];
            for (let i = levels.length - 1; i >= 0; i--) {
                if (totalExp >= (i > 0 ? levels[i-1].maxExp : 0)) { currentLvlData = levels[i]; break; }
            }

            document.getElementById('level-name').innerText = currentLvlData.name;
            document.getElementById('level-crime').innerText = currentLvlData.crime;
            document.getElementById('exp-counter').innerText = totalExp;
            document.getElementById('level-num').innerText = currentLvlData.level;

            let prevTarget = currentLvlData.level > 1 ? levels[currentLvlData.level - 2].maxExp : 0;
            let currentTarget = currentLvlData.maxExp;
            
            let progressPercent = ((totalExp - prevTarget) / (currentTarget - prevTarget)) * 100;
            if (progressPercent > 100) progressPercent = 100;
            if (progressPercent < 0) progressPercent = 0;

            document.getElementById('exp-text').innerText = `${totalExp} / ${currentTarget} ДЕЛ`;
            document.getElementById('exp-bar').style.width = `${progressPercent}%`;
        }

        function changeExp(amount) {
            let oldLvl = document.getElementById('level-num').innerText;
            totalExp += amount;
            
            // Проверка на максимум
            let max = levels[levels.length - 1].maxExp;
            if (totalExp > max) totalExp = max;
            if (totalExp < 0) totalExp = 0;

            localStorage.setItem('prisonExp', totalExp);
            updateLevelUI();
            
            let newLvl = document.getElementById('level-num').innerText;
            if (oldLvl !== newLvl && totalExp >= 7) {
                setTimeout(() => tg.showAlert(`🔥 НОВЫЙ УРОВЕНЬ!\nТеперь вы: ${document.getElementById('level-name').innerText}`), 1000);
            }
        }
        updateLevelUI();

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // --- ЛОГИКА ИГРЫ ---
        let currentMode = 'bot';
        let currentCase = null;
        let timerRead, timerChoose;
        let timeLeftRead = 25, timeLeftChoose = 90;
        let round = 1;
        let p1Choice = null, p2Choice = null;

        function startGame(mode) {
            currentMode = mode;
            round = 1;
            nextRound();
        }

        function startOnline() {
            tg.showAlert("ПОИСК СОУЧАСТНИКА...");
            setTimeout(() => { startGame('bot'); }, 1500);
        }

        function nextRound() {
            if (round > 2) {
                showScreen('main-menu');
                return;
            }

            // Выбираем случайное дело
            currentCase = cases[Math.floor(Math.random() * cases.length)];
            document.getElementById('case-title-read').innerText = `ДЕЛО №${Math.floor(Math.random()*900)+100}`;
            document.getElementById('case-text-read').innerText = currentCase.text;
            document.getElementById('case-brief').innerText = "Вспомните детали дела и примите решение.";

            document.getElementById('target-label').innerText = `РАУНД ${round} ИЗ 2`;
            document.getElementById('mode-label').innerText = currentMode === 'bot' ? 'С БОТОМ' : 'ЛОКАЛЬНО';

            // Сброс кнопок
            document.getElementById('choice-buttons').classList.remove('disabled-btn');
            document.getElementById('game-status').innerText = "ПРИМИТЕ РЕШЕНИЕ";
            
            // Запуск таймера чтения
            showScreen('case-screen');
            timeLeftRead = 25;
            document.getElementById('timer-read').innerText = timeLeftRead;
            clearInterval(timerRead);
            timerRead = setInterval(() => {
                timeLeftRead--;
                document.getElementById('timer-read').innerText = timeLeftRead;
                if (timeLeftRead <= 0) {
                    clearInterval(timerRead);
                    startChoosingPhase();
                }
            }, 1000);
        }

        function startChoosingPhase() {
            showScreen('game-screen');
            timeLeftChoose = 90;
            document.getElementById('timer-choose').innerText = timeLeftChoose;
            document.getElementById('timer-choose').className = 'timer-display';
            
            p1Choice = null;
            p2Choice = null;

            clearInterval(timerChoose);
            timerChoose = setInterval(() => {
                timeLeftChoose--;
                document.getElementById('timer-choose').innerText = timeLeftChoose;
                if (timeLeftChoose <= 10) {
                    document.getElementById('timer-choose').className = 'timer-display red';
                }
                if (timeLeftChoose <= 0) {
                    clearInterval(timerChoose);
                    tg.showAlert("ВРЕМЯ ВЫШЛО! Судья выносит приговор автоматически (Оба сдают).");
                    makeChoice('betray');
                }
            }, 1000);
        }

        function makeChoice(choice) {
            clearInterval(timerChoose);
            p1Choice = choice;

            // Бот или Второй игрок
            if (currentMode === 'bot') {
                // Бот с вероятностью 50% сдает
                p2Choice = Math.random() > 0.5 ? 'betray' : 'silent';
            } else {
                // Локально (для простоты второй игрок тоже рандом, так как экран один)
                p2Choice = Math.random() > 0.5 ? 'betray' : 'silent';
            }

            calculateResult();
        }

        function calculateResult() {
            let p1Years = 0, p2Years = 0;
            let text = "";

            // МАТРИЦА ПРИГОВОРОВ
            if (p1Choice === 'betray' && p2Choice === 'silent') {
                p1Years = 0; p2Years = 7;
                text = "Ты сдал напарника. <b>Ты свободен!</b> Напарник получил 7 лет.";
            } else if (p1Choice === 'silent' && p2Choice === 'betray') {
                p1Years = 7; p2Years = 0;
                text = "Напарник сдал тебя. <b>Ты получил 7 лет.</b> Он вышел на свободу.";
            } else if (p1Choice === 'betray' && p2Choice === 'betray') {
                p1Years = 7; p2Years = 7;
                text = "Вы оба сдали друг друга. <b>Каждый получил по 7 лет.</b>";
            } else if (p1Choice === 'silent' && p2Choice === 'silent') {
                p1Years = 3; p2Years = 3;
                text = "Вы оба молчали. Судья смягчился. <b>Каждый получил по 3 года.</b>";
            }

            // ОПРЕДЕЛЕНИЕ ПОБЕДИТЕЛЯ
            if (p1Years < p2Years) {
                text += "<br><br><span class='text-green'>ТЫ ВЫИГРАЛ РАУНД! (Сгорело 1 дело)</span>";
                changeExp(1);
            } else if (p1Years > p2Years) {
                text += "<br><br><span class='text-red'>ТЫ ПРОИГРАЛ РАУНД! (+1 дело в срок)</span>";
                changeExp(-1);
            } else {
                text += "<br><br><span style='color:#888'>НИЧЬЯ. Сроки равны, дела не меняются.</span>";
            }

            document.getElementById('result-text').innerHTML = text;
            showScreen('result-screen');
            round++;
        }
    </script>
</body>
</html>
